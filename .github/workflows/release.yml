name: Build release

on:
  release:
    types: [ published ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test and build release
        run: ./gradlew test buildPlugin buildCompilerJar verifyPlugin :rscm-gradle-plugin:validatePlugins
      - name: Upload release assets
        run: >
          gh release upload "${{ github.event.release.tag_name }}"
          ./build/distributions/rscm-plugin-*.zip
          ./build/distributions/rscm-compiler-*.jar
          --clobber
        env:
          GH_TOKEN: ${{ github.token }}
